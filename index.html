<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/assets/theme/logo.jpg" />
    <meta name="description" content="昼见日过山，夜见月入江，其间见江楠。" />
    <meta property="og:title" content="遇见江楠" />
    <meta property="og:description" content="昼见日过山，夜见月入江，其间见江楠。" />
    <meta property="og:image" content="https://www.jiangnanstudio.cloud/assets/theme/logo.jpg" />
    <meta property="og:url" content="https://www.jiangnanstudio.cloud" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="遇见江楠" />
    <meta name="twitter:description" content="昼见日过山，夜见月入江，其间见江楠。" />
    <meta name="twitter:image" content="https://www.jiangnanstudio.cloud/assets/theme/logo.jpg" />
    <title>遇见江楠 · 昼见日过山，夜见月入江</title>
    <!-- 中文书法体（马善政）+ 宋体正文；display=swap 避免阻塞渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light, html.light body {
        background-color: #f2eee3 !important;
        color: #1c2026;
      }
      html.dark, html.dark body {
        background-color: #161a21 !important;
        color: #e8e4d8;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function() {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener('message', function(event) {
            if (event.data && typeof event.data.theme === 'string') {
              var theme = event.data.theme;
              if (theme === 'light' || theme === 'dark') {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境：优先读取 localStorage 持久化主题，无则默认 light
          var stored = null;
          try { stored = localStorage.getItem('theme'); } catch (e) { /* ignore */ }
          applyThemeToDOM(stored === 'dark' ? 'dark' : 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
